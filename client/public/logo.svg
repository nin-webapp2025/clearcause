    <circle cx="16" cy="16" r="14" fill="none" stroke="#1DAA97" stroke-width="3.5"
            stroke-linecap="round" stroke-dasharray="66 22" transform="rotate(-54 16 16)"/>
    <circle cx="16" cy="16" r="6" fill="#1DAA97"/>
  </g>
  <text x="44" y="26" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" fill="currentColor" letter-spacing="-0.4">
    Clear<tspan fill="#1DAA97">Cause</tspan>
  </text>
</svg>
